# Where each system's connector comes from. A tool lists the systems it reads, and its page
# tells readers how to connect each one: by installing the plugin that bundles it, or (for a
# system with no `plugin`) by adding the vendor's own connector in Claude's connector settings.
# A connector lives in at most one plugin: a new plugin declares the systems it reads instead
# of bundling its own copy (see docs/authoring-conventions.md).

QuickBooks:
  plugin:
Stripe:
  plugin: all-systems-go
Ramp:
  plugin: all-systems-go
Mercury:
  plugin: all-systems-go
