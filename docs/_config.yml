title: airCFO · Claude for Startup Finance
description: Give Claude your finance context once — an airCFO plugin for Claude Cowork that connects Stripe, Ramp, Mercury, and QuickBooks behind one durable finance profile.

# The site is served at https://aircfo.github.io/claude-startup-finance/ (a GitHub
# Pages project site). These two keys make asset paths and internal links resolve
# under that subpath. If you later attach a custom domain (a CNAME file), set baseurl to "".
url: "https://aircfo.github.io"
baseurl: "/claude-startup-finance"

# The site uses its own airCFO-branded layout and stylesheet (docs/_layouts/default.html
# + docs/assets/css/style.css) instead of a gem theme.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Let [text](other-page.md) links between docs resolve to their published URLs.
plugins:
  - jekyll-relative-links
