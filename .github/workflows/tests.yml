name: tests

# Runs the skills' offline test suites on every pull request and on main. The
# tests use synthetic fixtures only and never reach the network, so the job
# needs no secrets and only read access to the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-spend-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/ai-cfo-lab/skills/ai-spend-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # openpyxl is optional for the skill; installing it here also exercises the
      # Excel workbook and roster paths.
      - run: uv pip install --system openpyxl
      - run: node --test scripts/__tests__/*.test.js
