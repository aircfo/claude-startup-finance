name: tests

# Runs the skills' offline test suites on every pull request and on main. The
# tests use synthetic fixtures only and never reach the network, so the job
# needs no secrets and only read access to the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-spend-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/ai-cfo-lab/skills/ai-spend-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The skill's scripts must run on Cowork's local shell, which has Python 3.10.
          python-version: "3.10"
      - run: python -m unittest discover -s scripts/__tests__ -v
